name: daily

on:
  schedule:
    - cron: "23 10 * * *"  # 10:23 UTC, early morning in the US
  workflow_dispatch:

permissions:
  contents: write  # commits the refreshed data/state back

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'will-they-sponsor' }}
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q tests

      # SmartRecruiters needs one call per posting; reuse yesterday's unchanged ones
      - uses: actions/cache@v4
        with:
          path: data/work/boards/smartrecruiters__*.json
          key: sr-${{ github.run_id }}
          restore-keys: sr-

      # classify through a Claude subscription (token from `claude setup-token`); an API key wins if both are set
      - name: Install Claude Code
        if: env.HAS_CLAUDE == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch, classify, build
        run: python -m vjb daily
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VJB_MAX_LLM_CALLS: ${{ vars.MAX_LLM_CALLS || '80' }}
          VJB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VJB_SITE_URL: ${{ vars.SITE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/site
          retention-days: 7

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy out/site --project-name="$PROJECT" --branch=main --commit-dirty=true

      # last, and even after a failure: the LLM cache is paid for and stays valid
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/state
          if ! git diff --cached --quiet; then
            git commit -m "Daily state $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi
